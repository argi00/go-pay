[project]
name = "gopay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "argi00", email = "mamaneargimalambawa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]


[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
